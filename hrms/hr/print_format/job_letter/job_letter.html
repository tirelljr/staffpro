<meta name="pdfkit-page-size" content="Letter">
<meta name="pdfkit-margin-top" content="0mm">
<meta name="pdfkit-margin-right" content="0mm">
<meta name="pdfkit-margin-bottom" content="0mm">
<meta name="pdfkit-margin-left" content="0mm">
<style>
	.print-format {
		margin-top: 0mm;
		margin-right: 0mm;
		margin-bottom: 0mm;
		margin-left: 0mm;
		page-size: Letter;
		padding: 0 !important;
		border: none !important;
		background: #fff !important;
	}
	.print-format-gutter,
	.job-letter-page {
		margin: 0 !important;
		padding: 0 !important;
		border: none !important;
		background: #fff !important;
	}
	html,
	body {
		margin: 0 !important;
		padding: 0 !important;
	}
	.sp-letter {
		min-height: 0 !important;
		height: 10.92in !important;
		max-height: 10.92in !important;
		overflow: hidden !important;
	}
	@page {
		size: Letter;
		margin: 0;
	}
</style>
<div class="job-letter-page">
{%- if doc.letter_html -%}
	{{ doc.letter_html | safe }}
{%- else -%}
	<p>{{ _("This job letter has not been generated.") }}</p>
{%- endif -%}
</div>
